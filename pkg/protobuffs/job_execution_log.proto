syntax = "proto3";

package job_execution_log;

import "google/protobuf/timestamp.proto";

message JobExecutionLog {
    uint64 id = 1;
    string unique_id = 2;
    uint64 state = 3;
    uint64 node_id = 4;
    google.protobuf.Timestamp last_execution_datetime = 5;
    google.protobuf.Timestamp next_execution_datetime = 6;
    uint64 job_id = 7;
    uint64 job_queue_version = 8;
    uint64 execution_version = 9;
    google.protobuf.Timestamp data_created = 10;
}
