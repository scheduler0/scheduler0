name: Deploy Scheduler0-Private (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment (production or staging)"
        required: true
        type: string
      env_name:
        description: "Short environment name for resource names and SSM paths (production or staging)"
        required: true
        type: string
      log_level:
        description: "SCHEDULER0_LOGLEVEL for the private node (DEBUG, INFO, WARN, ERROR). Runtime secrets come from SSM, not from here."
        required: false
        default: "INFO"
        type: string
      max_workers:
        description: "SCHEDULER0_MAX_WORKERS for the private node"
        required: true
        type: string
      platform_webhook_url:
        description: "PLATFORM_WEBHOOK_URL: app.scheduler.com callback the node POSTs job-failure / ai-credits-low notifications to (e.g. https://app.scheduler0.com/scheduler0_callback). Must match platform_webhook_url in scheduler0-terraform."
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Scheduler0-Private to ECS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENV_NAME: ${{ inputs.env_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Derive ECS resource names
      run: |
        set -euo pipefail
        echo "ECR_REPOSITORY=${ENV_NAME}-scheduler0-private"                                     >> "$GITHUB_ENV"
        echo "ECS_CLUSTER=${ENV_NAME}_scheduler0_ecs_cluster"                                    >> "$GITHUB_ENV"
        echo "ECS_SERVICE=${ENV_NAME}_scheduler0-private-1-service"                              >> "$GITHUB_ENV"
        echo "ECS_TASK_DEFINITION=${ENV_NAME}-scheduler0-private-1-ecs-task-definition.json"     >> "$GITHUB_ENV"
        echo "CONTAINER_NAME=${ENV_NAME}-scheduler0-private-1"                                     >> "$GITHUB_ENV"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Resolve AWS account ID
      run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

    # Runtime secrets (auth username/password, secret key, webhook secret) are
    # injected by ECS from SSM (/scheduler0/{env}/*) via the `secrets:` block
    # below; Doppler syncs them into SSM natively. The deploy itself needs
    # nothing from Doppler, so the CLI is intentionally not installed here
    # (its installer was the failing step of the 2026-09-13 00:28Z prod deploy).
    - name: Derive runtime environment
      run: |
        set -euo pipefail
        echo "SCHEDULER0_LOGLEVEL=${{ inputs.log_level }}" >> "$GITHUB_ENV"
        echo "SCHEDULER0_ETCD_ENDPOINTS=http://${{ inputs.env_name }}-scheduler0-etcd.${{ inputs.env_name }}-scheduler0.local:2379" >> "$GITHUB_ENV"
        # Ops alerts topic: created by scheduler0-terraform (common/monitoring),
        # same one CloudWatch alarms and app.scheduler0.com publish to. The
        # task needs sns:Publish on it (common/iam ecs_task_execution_role).
        echo "ALERTS_SNS_TOPIC_ARN=arn:aws:sns:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:${{ inputs.env_name }}-scheduler0-alerts" >> "$GITHUB_ENV"

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail

        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        IMAGE_URI_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

        docker build -t "${IMAGE_URI}" -t "${IMAGE_URI_LATEST}" .
        docker push "${IMAGE_URI}"
        docker push "${IMAGE_URI_LATEST}"

        echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

    - name: Create task definition for instance 1
      id: task-def-1
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}
        environment-variables: |
          SCHEDULER0_PORT=9091
          SCHEDULER0_BOOTSTRAP=true
          SCHEDULER0_NODE_ID=1
          SCHEDULER0_HOST=0.0.0.0
          SCHEDULER0_SQLITE_PATH=/app/scheduler0-private-1/sqlite_data/db.db
          SCHEDULER0_RAFT_DATA_DIR=/app/scheduler0-private-1/raft_data
          SCHEDULER0_NODE_PORT=7071
          SCHEDULER0_CLIENT_PORT=9091
          SCHEDULER0_SERVICE_DISCOVERY_HOST=${{ inputs.env_name }}-scheduler0-private-1.${{ inputs.env_name }}-scheduler0.local
          SCHEDULER0_LOGLEVEL=${{ env.SCHEDULER0_LOGLEVEL }}
          SCHEDULER0_AI_INTENT_CLASSIFIER_URL=http://${{ inputs.env_name }}-scheduler0-intent-classifier.${{ inputs.env_name }}-scheduler0.local:8080
          SCHEDULER0_ETCD_ENDPOINTS=${{ env.SCHEDULER0_ETCD_ENDPOINTS }}
          SCHEDULER0_S3_BUCKET=scheduler0-backups-${{ inputs.env_name }}
          SCHEDULER0_AWS_REGION=${{ env.AWS_REGION }}
          SCHEDULER0_MAX_WORKERS=${{ inputs.max_workers }}
          PLATFORM_WEBHOOK_URL=${{ inputs.platform_webhook_url }}
          ALERTS_SNS_TOPIC_ARN=${{ env.ALERTS_SNS_TOPIC_ARN }}
          SCHEDULER0_ENV=${{ inputs.env_name }}
        # NOTE: this list is what actually runs. The Terraform-managed task
        # definition in scheduler0-terraform/common/ecs also sets these, but the
        # ECS service there has ignore_changes = [task_definition], so anything
        # only added on the Terraform side never reaches the running task.
        # Keep the two in sync.
        secrets: |
          SCHEDULER0_AUTH_USERNAME=arn:aws:ssm:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:parameter/scheduler0/${{ inputs.env_name }}/SCHEDULER0_AUTH_USERNAME
          SCHEDULER0_AUTH_PASSWORD=arn:aws:ssm:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:parameter/scheduler0/${{ inputs.env_name }}/SCHEDULER0_AUTH_PASSWORD
          SCHEDULER0_SECRET_KEY=arn:aws:ssm:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:parameter/scheduler0/${{ inputs.env_name }}/SCHEDULER0_SECRET_KEY
          PLATFORM_WEBHOOK_SECRET=arn:aws:ssm:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:parameter/scheduler0/${{ inputs.env_name }}/SCHEDULER0_WEBHOOK_SECRET

    - name: Register task definition for instance 1
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://${{ steps.task-def-1.outputs.task-definition }} \
          --region ${{ env.AWS_REGION }} \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "TASK_DEF_ARN_1=${TASK_DEF_ARN}" >> $GITHUB_ENV
        echo "Task definition for instance 1: ${TASK_DEF_ARN}"

    - name: Update ECS service for instance 1
      run: |
        set -euo pipefail

        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition ${{ env.TASK_DEF_ARN_1 }} \
          --region ${{ env.AWS_REGION }} \
          --force-new-deployment

        echo "Waiting for service to stabilize..."
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }}

        echo "✓ Instance 1 deployment completed successfully"

    - name: Check ECS service status
      run: |
        aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,PendingCount:pendingCount}' \
          --output table
