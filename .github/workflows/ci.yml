name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc
        go mod download

    - name: Lint
      run: go vet ./...

    - name: Format check
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Run tests
      env:
        CGO_ENABLED: 1
      run: go test -v ./...
